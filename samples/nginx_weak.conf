http {
    server {
        listen 443 ssl;
        server_name api.example.com;

        ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

        location /api/v1/ {
            proxy_pass http://backend_api;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Credentials true;
        }
    }
}
